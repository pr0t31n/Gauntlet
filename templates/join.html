<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>
  {{ project.client_short or project.client_name or 'Project' }} — Field Device
</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* ─── Reset & Base ─────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #0a0c0f;
    --bg2:          #111418;
    --bg3:          #1a1e24;
    --border:       #2a3040;
    --gold:         #c8922a;
    --gold-dim:     #8a6018;
    --gold-glow:    rgba(200,146,42,.18);
    --green:        #3ddc84;
    --green-dim:    rgba(61,220,132,.15);
    --red:          #ff5555;
    --red-dim:      rgba(255,85,85,.15);
    --amber:        #ffb347;
    --text:         #e8e0d0;
    --text-dim:     #8a8880;
    --mono:         'Share Tech Mono', monospace;
    --display:      'Cinzel', serif;
    --safe-bottom:  env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ─── Layout shell ──────────────────────────────────────────────────────── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ─── Header ────────────────────────────────────────────────────────────── */
  header {
    flex-shrink: 0;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-gear {
    font-size: 20px;
    color: var(--gold);
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .header-info { flex: 1; min-width: 0; }
  .header-project {
    font-family: var(--display);
    font-size: 13px;
    color: var(--gold);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-device {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conn-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    transition: background .3s;
  }
  .conn-dot.connected    { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .conn-dot.disconnected { background: var(--red); }
  .conn-dot.waiting      { background: var(--amber); animation: pulse-dot 1s infinite; }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ─── Main scrollable area ──────────────────────────────────────────────── */
  main {
    flex: 1;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ─── Status card ───────────────────────────────────────────────────────── */
  .status-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .status-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .status-value {
    font-size: 13px;
    color: var(--text);
  }
  .status-value.running { color: var(--green); }
  .status-value.idle    { color: var(--text-dim); }
  .status-value.error   { color: var(--red); }

  .module-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--gold);
  }

  /* ─── Prompt card ───────────────────────────────────────────────────────── */
  .prompt-card {
    background: var(--bg2);
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    overflow: hidden;
    animation: slide-in .25s ease;
  }
  @keyframes slide-in { from { opacity:0; transform:translateY(12px); } }
  .prompt-header {
    background: var(--gold-glow);
    border-bottom: 1px solid var(--gold-dim);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .prompt-header-icon { font-size: 16px; }
  .prompt-header-text {
    font-family: var(--display);
    font-size: 11px;
    color: var(--gold);
    letter-spacing: .06em;
  }
  .prompt-body { padding: 14px; }
  .prompt-question {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    margin-bottom: 12px;
  }

  /* ─── Options grid ──────────────────────────────────────────────────────── */
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  .option-btn {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    padding-left: 36px;
  }
  .option-btn::before {
    content: '';
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border);
    transition: border-color .15s;
  }
  .option-btn.selected {
    background: var(--gold-glow);
    border-color: var(--gold);
    color: var(--gold);
  }
  .option-btn.selected::before {
    border-color: var(--gold);
    background: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }
  .option-btn:active { opacity: .8; }

  /* ─── Text input ────────────────────────────────────────────────────────── */
  .text-input-wrap { margin-bottom: 10px; }
  .text-input-wrap input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .text-input-wrap input:focus { border-color: var(--gold); }

  /* ─── Submit row ────────────────────────────────────────────────────────── */
  .submit-row {
    display: flex;
    gap: 8px;
  }
  .btn-submit {
    flex: 1;
    padding: 14px;
    background: var(--gold);
    border: none;
    border-radius: 8px;
    color: #0a0c0f;
    font-family: var(--display);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .06em;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn-submit:active { opacity: .85; transform: scale(.98); }
  .btn-submit:disabled { opacity: .35; cursor: default; }
  .btn-skip {
    padding: 14px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-skip:active { opacity: .7; }

  /* ─── Photo section ─────────────────────────────────────────────────────── */
  .photo-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .photo-card-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  /* Camera preview fills the card */
  #cameraPreview {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
    background: #000;
  }
  #capturedImg {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: none;
    background: #000;
  }
  .photo-actions {
    padding: 10px 14px;
    display: flex;
    gap: 8px;
  }
  .btn-camera {
    flex: 1;
    padding: 12px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    text-align: center;
  }
  .btn-camera:active { opacity: .7; }
  .btn-send-photo {
    flex: 1;
    padding: 12px;
    background: var(--green-dim);
    border: 1px solid var(--green);
    border-radius: 6px;
    color: var(--green);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    text-align: center;
  }
  .btn-send-photo:disabled { opacity: .3; cursor: default; }
  .btn-send-photo:not(:disabled):active { opacity: .7; }
  .photo-status {
    padding: 6px 14px 10px;
    font-size: 11px;
    color: var(--text-dim);
    min-height: 24px;
  }
  .photo-status.ok    { color: var(--green); }
  .photo-status.error { color: var(--red); }

  /* Hidden file input (fallback for non-camera) */
  #fileInput { display: none; }

  /* ─── Idle / waiting state ──────────────────────────────────────────────── */
  .idle-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 32px 24px;
    text-align: center;
    color: var(--text-dim);
  }
  .idle-gear {
    font-size: 48px;
    opacity: .3;
    animation: spin 12s linear infinite;
  }
  .idle-title {
    font-family: var(--display);
    font-size: 15px;
    color: var(--gold-dim);
    letter-spacing: .08em;
  }
  .idle-sub { font-size: 12px; line-height: 1.6; }

  /* ─── Activity log (compact) ────────────────────────────────────────────── */
  .log-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .log-header {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .log-list {
    max-height: 160px;
    overflow-y: auto;
    padding: 6px 0;
    font-size: 11px;
    -webkit-overflow-scrolling: touch;
  }
  .log-entry {
    padding: 4px 14px;
    color: var(--text-dim);
    border-left: 2px solid transparent;
    line-height: 1.4;
  }
  .log-entry.finding { border-left-color: var(--amber); color: var(--amber); }
  .log-entry.status  { border-left-color: var(--gold-dim); color: var(--gold); }
  .log-entry.system  { color: #5a6070; }
  .log-entry.answered{ border-left-color: var(--green); color: var(--green); }
  .log-entry.error   { border-left-color: var(--red); color: var(--red); }

  /* ─── Bottom safe area padding ──────────────────────────────────────────── */
  .bottom-spacer {
    flex-shrink: 0;
    height: calc(8px + var(--safe-bottom));
  }

  /* ─── Utility ───────────────────────────────────────────────────────────── */
  .hidden { display: none !important; }
  .spin { animation: spin 1s linear infinite; }

  /* ─── Share / QR card ───────────────────────────────────────────────────── */
  .share-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .share-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  .share-card-header:active { opacity: .7; }
  .share-card-body {
    padding: 12px 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  #shareQrBox {
    background: #fff;
    border-radius: 4px;
    padding: 4px;
    flex-shrink: 0;
    width: 92px;
    height: 92px;
    overflow: hidden;
    line-height: 0;
  }
  .share-url {
    flex: 1;
    min-width: 0;
  }
  .share-url-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .share-url-val {
    font-size: 11px;
    color: var(--gold);
    word-break: break-all;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .btn-copy-url {
    padding: 6px 12px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
  }
  .btn-copy-url:active { opacity: .7; }
</style>

</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <span class="header-gear">⚙</span>
    <div class="header-info">
      <div class="header-project">
        {{ project.client_short or project.client_name or 'Project' }}
        {% if project.device %} — {{ project.device }}{% endif %}
      </div>
      <div class="header-device" id="headerStatus">Connecting…</div>
    </div>
    <div class="conn-dot" id="connDot"></div>
  </header>

  <!-- Main content -->
  <main id="main">

    <!-- Session status row -->
    <div class="status-card" id="sessionCard">
      <div class="status-label">Session</div>
      <div class="status-value idle" id="sessionValue">Connecting…</div>
      <div id="moduleTag"></div>
    </div>

    <!-- Active prompt card (hidden until a prompt arrives) -->
    <div class="prompt-card hidden" id="promptCard">
      <div class="prompt-header">
        <span class="prompt-header-icon">⚡</span>
        <span class="prompt-header-text">INPUT REQUIRED</span>
      </div>
      <div class="prompt-body">
        <div class="prompt-question" id="promptQuestion"></div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="text-input-wrap" id="textInputWrap">
          <input type="text" id="textAnswer" placeholder="Type answer…" autocomplete="off" autocorrect="off">
        </div>
        <div class="submit-row">
          <button class="btn-submit" id="btnSubmit">✓ Submit</button>
          <button class="btn-skip" id="btnSkip">Skip</button>
        </div>
      </div>
    </div>

    <!-- ── Always-visible photo capture card ── -->
    <div class="photo-card" id="photoCard">
      <div class="photo-card-header">
        <span>📷</span> Photo Capture
        <span id="photoCardHint" style="margin-left:auto; font-size:10px; color:var(--text-dim)">
          Tap Capture or choose a file
        </span>
      </div>
      <video id="cameraPreview" autoplay playsinline muted></video>
      <img id="capturedImg" alt="Captured photo">
      <input type="file" id="fileInput" accept="image/*">
      <div class="photo-actions">
        <button class="btn-camera" id="btnCapture">📷 Capture</button>
        <button class="btn-camera" id="btnRetake" style="display:none">↩ Retake</button>
        <button class="btn-camera" id="btnChooseFile">🗂 File</button>
        <button class="btn-send-photo" id="btnSendPhoto" disabled>⬆ Send</button>
      </div>
      <div class="photo-status" id="photoStatus"></div>
    </div>

    <!-- Activity log -->
    <div class="log-card">
      <div class="log-header">
        <span>Activity</span>
        <span id="logCount" style="color:var(--text-dim); font-size:10px">0 events</span>
      </div>
      <div class="log-list" id="logList"></div>
    </div>

    <!-- Share / QR card — tap to expand and share the join URL -->
    <div class="share-card" id="shareCard">
      <div class="share-card-header" id="shareToggle">
        <span>🔗</span>
        <span>Share this session</span>
        <span id="shareChevron" style="margin-left:auto">▸</span>
      </div>
      <div class="share-card-body hidden" id="shareBody">
        <canvas id="shareQrBox"
                style="border-radius:4px; display:block; background:#fff"></canvas>
        <div class="share-url">
          <div class="share-url-label">Scan or copy URL</div>
          <div class="share-url-val" id="shareUrlVal">Loading…</div>
          <button class="btn-copy-url" id="btnCopyShareUrl">⎘ Copy URL</button>
        </div>
      </div>
    </div>

  </main>
  <div class="bottom-spacer"></div>
</div>

<!-- QR canvas renderer -->
<script src="/static/js/qrgen.js"></script>
<!-- Socket.IO -->
<script>
(function() {
  function loadScript(src, cb, err) {
    var s = document.createElement('script');
    s.src = src; s.onload = cb; s.onerror = err;
    document.head.appendChild(s);
  }
  loadScript('/socket.io/socket.io.js', init,
    function() {
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js',
        init,
        function() { document.getElementById('headerStatus').textContent = 'socket.io load failed'; }
      );
    }
  );
})();

function init() {
  'use strict';

  const PROJECT_ID = '{{ project_id }}';
  const IFACE_MODULES = {{ interface_modules | tojson }};

  // ── DOM refs ─────────────────────────────────────────────────────────────
  const connDot       = document.getElementById('connDot');
  const headerStatus  = document.getElementById('headerStatus');
  const sessionValue  = document.getElementById('sessionValue');
  const moduleTag     = document.getElementById('moduleTag');
  const promptCard    = document.getElementById('promptCard');
  const promptQ       = document.getElementById('promptQuestion');
  const optionsGrid   = document.getElementById('optionsGrid');
  const textWrap      = document.getElementById('textInputWrap');
  const textAnswer    = document.getElementById('textAnswer');
  const btnSubmit     = document.getElementById('btnSubmit');
  const btnSkip       = document.getElementById('btnSkip');
  const photoCard     = document.getElementById('photoCard');
  const photoCardHint = document.getElementById('photoCardHint');
  const cameraPreview = document.getElementById('cameraPreview');
  const capturedImg   = document.getElementById('capturedImg');
  const fileInput     = document.getElementById('fileInput');
  const btnCapture    = document.getElementById('btnCapture');
  const btnRetake     = document.getElementById('btnRetake');
  const btnChooseFile = document.getElementById('btnChooseFile');
  const btnSendPhoto  = document.getElementById('btnSendPhoto');
  const photoStatus   = document.getElementById('photoStatus');
  const logList       = document.getElementById('logList');
  const logCount      = document.getElementById('logCount');

  let selectedOption    = null;
  let capturedBlob      = null;
  let capturedExt       = 'jpg';
  let cameraStream      = null;
  let currentInstanceId = null;
  let logEntries        = 0;
  let promptActive      = false;

  // Start camera immediately — photo card is always visible
  startCamera();

  // ── Socket ────────────────────────────────────────────────────────────────
  const socket = io();

  socket.on('connect', () => {
    connDot.className     = 'conn-dot connected';
    headerStatus.textContent = 'Connected';
    socket.emit('join_project', { project_id: PROJECT_ID });
    // Fetch any pre-existing photo context (set by Evidence tab before joining)
    fetch(`/api/get_photo_context/${PROJECT_ID}`)
      .then(r => r.json())
      .then(ctx => { if (ctx && ctx.instance_id) applyPhotoContext(ctx); })
      .catch(() => {});
  });

  // Live context update when Evidence tab sends mobile to capture
  socket.on('photo_context', ctx => {
    if (ctx && ctx.instance_id) applyPhotoContext(ctx);
  });

  function applyPhotoContext(ctx) {
    currentInstanceId = ctx.instance_id || null;
    if (moduleTag && ctx.module) {
      moduleTag.innerHTML =
        `<span class="module-badge">📷 Photo — ${ctx.interface || ''} / ${ctx.inst_key || ''}</span>`;
    }
    addLog(`📷 Photo context set: ${ctx.instance_id || ''}`, 'status');
  }

  socket.on('disconnect', () => {
    connDot.className     = 'conn-dot disconnected';
    headerStatus.textContent = 'Disconnected — reconnecting…';
  });

  // ── Session state on join ─────────────────────────────────────────────────
  socket.on('session_state', data => {
    if (data.gearbox_running) {
      setSessionRunning();
      // Replay active module if server has one
      if (data.active_module) applyModuleStatus(data.active_module);
      // Replay pending prompt if server has one waiting
      if (data.pending_prompt) showPrompt(data.pending_prompt);
    } else {
      setSessionIdle();
    }
  });

  socket.on('peer_joined', () => {
    addLog('Another device joined the session.', 'system');
  });

  // ── Gearbox lifecycle ─────────────────────────────────────────────────────
  socket.on('gearbox_started', () => {
    setSessionRunning();
    addLog('GearBox started.', 'status');
  });

  socket.on('gearbox_done', data => {
    setSessionIdle();
    dismissPrompt();
    addLog('GearBox finished (exit ' + (data.returncode !== undefined ? data.returncode : '?') + ').', 'status');
  });

  socket.on('gearbox_stopped', () => {
    setSessionIdle();
    dismissPrompt();
    addLog('GearBox stopped.', 'system');
  });

  socket.on('gearbox_error', data => {
    addLog('Error: ' + (data.error || ''), 'error');
  });

  // ── Module status ─────────────────────────────────────────────────────────
  socket.on('module_status', applyModuleStatus);

  function applyModuleStatus(payload) {
    const mod      = payload.module    || '';
    const status   = payload.status    || '';
    const iface    = payload.interface || '';
    const inst     = payload.instance  || '';
    const subdev   = payload.subdevice || '';

    // Build instance_id
    currentInstanceId = subdev + '.' + iface + '.' + inst;

    moduleTag.innerHTML = '<span class="module-badge">' +
      iface + ' / ' + inst + ' — ' + mod + ' [' + status.toUpperCase() + ']</span>';

    addLog(iface + '/' + inst + ' — ' + mod + ': ' + status.toUpperCase(), 'status');

    // Highlight the photo card header when Photo module is actively running
    if (mod === 'Photo' && status === 'running') {
      if (photoCardHint) photoCardHint.textContent = '📸 Photo needed — capture and send';
      photoCard.style.borderColor = 'var(--gold)';
      promptCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else if (mod === 'Photo' && status !== 'running') {
      if (photoCardHint) photoCardHint.textContent = 'Tap Capture or choose a file';
      photoCard.style.borderColor = '';
    }
  }

  // ── Prompts ───────────────────────────────────────────────────────────────
  socket.on('gearbox_prompt', showPrompt);

  function showPrompt(payload) {
    promptActive    = true;
    selectedOption  = null;
    const question  = payload.question || '';
    const options   = payload.options  || [];
    const ptype     = payload.type     || 'text';

    // Detect password prompts by type or question keyword
    const isPassword = ptype === 'password' ||
      /password|passphrase|secret|credential/i.test(question);

    promptQ.textContent    = question;
    optionsGrid.innerHTML  = '';
    textAnswer.value       = '';
    textAnswer.type        = isPassword ? 'password' : 'text';
    textAnswer.autocomplete = isPassword ? 'current-password' : 'off';
    textAnswer.placeholder  = isPassword ? 'Enter password…' : 'Type answer…';

    promptCard.classList.remove('hidden');

    // Build option buttons
    if (options.length > 0) {
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className   = 'option-btn';
        btn.textContent = opt;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.option-btn')
            .forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedOption   = opt;
          textAnswer.value = opt;
        });
        optionsGrid.appendChild(btn);
      });
      textWrap.style.display = 'none';
    } else {
      textWrap.style.display = '';
      setTimeout(() => textAnswer.focus(), 80);
    }

    // Scroll prompt into view — photo card is always below
    promptCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function dismissPrompt() {
    promptActive = false;
    promptCard.classList.add('hidden');
    selectedOption = null;
    optionsGrid.innerHTML = '';
    textAnswer.value = '';
    textAnswer.type  = 'text';
    textAnswer.placeholder = 'Type answer…';
    textWrap.style.display = '';
  }

  // ── Submit / skip ─────────────────────────────────────────────────────────
  function submitAnswer(answer) {
    if (!answer) return;
    socket.emit('gearbox_answer', { project_id: PROJECT_ID, answer });
    addLog('Answered: ' + answer, 'answered');
    dismissPrompt();
  }

  btnSubmit.addEventListener('click', () => {
    const ans = (selectedOption || textAnswer.value || '').trim();
    if (ans) submitAnswer(ans);
  });

  btnSkip.addEventListener('click', () => {
    submitAnswer('skip');
  });

  textAnswer.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const ans = textAnswer.value.trim();
      if (ans) submitAnswer(ans);
    }
  });

  // ── Findings (show in log) ────────────────────────────────────────────────
  socket.on('new_finding', data => {
    const risk  = data.risk  || 'Unknown';
    const title = data.title || '';
    addLog('[' + risk + '] ' + title, 'finding');
  });

  // ── Photo answered by another device ─────────────────────────────────────
  socket.on('photo_uploaded', data => {
    if (data.instance_id === currentInstanceId) {
      photoStatus.textContent = '✓ Photo received by session.';
      photoStatus.className   = 'photo-status ok';
      addLog('Photo uploaded: ' + (data.filename || ''), 'answered');
      if (promptActive) dismissPrompt();
    }
  });

  // ── Session helpers ───────────────────────────────────────────────────────
  function setSessionRunning() {
    sessionValue.textContent = '● GearBox Running';
    sessionValue.className   = 'status-value running';
    headerStatus.textContent = 'Session live';
    connDot.className        = 'conn-dot waiting';
  }

  function setSessionIdle() {
    sessionValue.textContent = '○ GearBox Idle';
    sessionValue.className   = 'status-value idle';
    headerStatus.textContent = 'Connected';
    connDot.className        = 'conn-dot connected';
    moduleTag.innerHTML      = '';
  }

  // ── Camera / photo ────────────────────────────────────────────────────────
  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      photoStatus.textContent = 'Camera not available — use the File button.';
      return;
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }
    }).then(stream => {
      cameraStream            = stream;
      cameraPreview.srcObject = stream;
    }).catch(() => {
      photoStatus.textContent = 'Camera access denied — use the File button.';
    });
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
  }

  btnCapture.addEventListener('click', () => {
    if (!cameraStream) { fileInput.click(); return; }
    const canvas = document.createElement('canvas');
    canvas.width  = cameraPreview.videoWidth  || 1280;
    canvas.height = cameraPreview.videoHeight || 720;
    canvas.getContext('2d').drawImage(cameraPreview, 0, 0);
    canvas.toBlob(blob => {
      capturedBlob          = blob;
      capturedExt           = 'jpg';
      capturedImg.src       = URL.createObjectURL(blob);
      capturedImg.style.display   = 'block';
      cameraPreview.style.display = 'none';
      btnCapture.style.display    = 'none';
      btnRetake.style.display     = '';
      btnSendPhoto.disabled       = false;
      stopCamera();
    }, 'image/jpeg', 0.92);
  });

  btnRetake.addEventListener('click', () => {
    capturedBlob                = null;
    capturedImg.style.display   = 'none';
    cameraPreview.style.display = 'block';
    btnRetake.style.display     = 'none';
    btnCapture.style.display    = '';
    btnSendPhoto.disabled       = true;
    startCamera();
  });

  btnChooseFile.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    capturedBlob = file;
    capturedExt  = (file.name.split('.').pop() || 'jpg').toLowerCase();
    capturedImg.src = URL.createObjectURL(file);
    capturedImg.style.display   = 'block';
    cameraPreview.style.display = 'none';
    btnRetake.style.display     = '';
    btnCapture.style.display    = 'none';
    btnSendPhoto.disabled       = false;
    stopCamera();
    photoStatus.textContent = 'File selected: ' + file.name;
  });

  btnSendPhoto.addEventListener('click', () => {
    if (!capturedBlob) return;
    btnSendPhoto.disabled    = true;
    photoStatus.textContent  = 'Uploading…';
    photoStatus.className    = 'photo-status';

    const formData = new FormData();
    formData.append('photo',       capturedBlob, 'photo.' + capturedExt);
    formData.append('project_id',  PROJECT_ID);
    formData.append('instance_id', currentInstanceId || 'unknown');

    fetch('/api/upload_photo', { method: 'POST', body: formData })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          photoStatus.textContent = '✓ Uploaded successfully.';
          photoStatus.className   = 'photo-status ok';
          // Always answer the gearbox queue — the server ignores it if no prompt is waiting
          socket.emit('gearbox_answer', {
            project_id: PROJECT_ID,
            answer:     data.path,
          });
          if (promptActive) dismissPrompt();
          addLog('Photo sent: ' + (data.path || ''), 'answered');
        } else {
          photoStatus.textContent = '✗ ' + (data.error || 'Upload failed');
          photoStatus.className   = 'photo-status error';
          btnSendPhoto.disabled   = false;
        }
      })
      .catch(err => {
        photoStatus.textContent = '✗ Network error: ' + err;
        photoStatus.className   = 'photo-status error';
        btnSendPhoto.disabled   = false;
      });
  });

  // ── Log helper ────────────────────────────────────────────────────────────
  function addLog(text, cls) {
    logEntries++;
    logCount.textContent = logEntries + ' event' + (logEntries !== 1 ? 's' : '');
    const entry = document.createElement('div');
    entry.className   = 'log-entry ' + (cls || '');
    entry.textContent = text;
    logList.appendChild(entry);
    logList.scrollTop = logList.scrollHeight;
    // Keep log capped at 200 entries
    while (logList.children.length > 200) logList.removeChild(logList.firstChild);
  }

  // ── Share card: fetch LAN URL, render QR, wire toggle ──────────────────
  const shareToggle  = document.getElementById('shareToggle');
  const shareBody    = document.getElementById('shareBody');
  const shareChevron = document.getElementById('shareChevron');
  const shareUrlVal  = document.getElementById('shareUrlVal');
  const btnCopyShareUrl = document.getElementById('btnCopyShareUrl');
  let   currentShareUrl = '';

  // Fetch the server-computed LAN URL (uses get_local_ip() on the server)
  const shareQrCanvas = document.getElementById('shareQrBox');
  function _renderShareQr(url) {
    if (shareQrCanvas && window.renderQr) {
      window.renderQr(url, shareQrCanvas, 150);
    }
  }
  fetch('/api/join_qr/{{ project_id }}')
    .then(r => r.json())
    .then(data => {
      currentShareUrl = data.url || (window.location.origin + '/join/{{ project_id }}');
      if (shareUrlVal) shareUrlVal.textContent = currentShareUrl;
      _renderShareQr(currentShareUrl);
    })
    .catch(() => {
      currentShareUrl = window.location.origin + '/join/{{ project_id }}';
      if (shareUrlVal) shareUrlVal.textContent = currentShareUrl;
      _renderShareQr(currentShareUrl);
    });

  if (shareToggle) {
    shareToggle.addEventListener('click', () => {
      const open = !shareBody.classList.contains('hidden');
      if (open) {
        shareBody.classList.add('hidden');
        shareChevron.textContent = '▸';
      } else {
        shareBody.classList.remove('hidden');
        shareChevron.textContent = '▾';
      }
    });
  }

  if (btnCopyShareUrl) {
    btnCopyShareUrl.addEventListener('click', () => {
      const url = currentShareUrl || shareUrlVal.textContent.trim();
      navigator.clipboard.writeText(url)
        .then(() => {
          btnCopyShareUrl.textContent = '✓ Copied!';
          setTimeout(() => { btnCopyShareUrl.textContent = '⎘ Copy URL'; }, 2000);
        })
        .catch(() => window.prompt('Copy URL:', url));
    });
  }
}
</script>
